<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tú diseñas</title>

<style>

body{
margin:0;
font-family:Poppins,sans-serif;
background:url('libreta.jpg') no-repeat center center fixed;
background-size:cover;
color:white;
text-align:center;
}

/* capa oscura */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.45);
z-index:-1;
}

header{
padding:60px;
background:linear-gradient(135deg,#00ffff88,#008cff88);
color:white;
}

section{
padding:80px 10%;
}

h1,h2,p{
text-shadow:2px 2px 8px rgba(0,0,0,0.7);
}

a{
color:#7df9ff;
text-decoration:none;
font-weight:bold;
}

a:hover{
text-decoration:underline;
}

/* formulario Google */
.formulario{
margin-top:40px;
background:white;
border-radius:15px;
padding:20px;
max-width:900px;
margin-left:auto;
margin-right:auto;
}

iframe{
width:100%;
height:900px;
border:none;
border-radius:10px;
}

/* NUEVO FORMULARIO PEDIDO */
.pedido{
margin-top:60px;
background:white;
border-radius:15px;
padding:30px;
max-width:500px;
margin-left:auto;
margin-right:auto;
color:black;
text-align:left;
}

.pedido label{
font-weight:bold;
}

.pedido select,
.pedido input{
width:100%;
padding:8px;
margin-top:5px;
margin-bottom:15px;
border-radius:8px;
border:1px solid #ccc;
}

.pedido button{
width:100%;
padding:10px;
background:#008cff;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

.pedido button:hover{
background:#006fd1;
}

</style>

<script>
const data = {
  "bebe": {
    nombre: "Stanley/Stella Baby",
    colores: {
      "Blanco": ["0-6m", "6-12m"],
      "Rosa": ["6-12m", "12-18m"],
      "Azul": ["0-6m", "12-18m"]
    }
  },
  "nino": {
    nombre: "Dogo Premium Niño",
    colores: {
      "Negro": ["3-4", "5-6", "7-8"],
      "Rojo": ["5-6", "7-8", "9-11"],
      "Azul": ["3-4", "9-11"]
    }
  },
  "adulto": {
    nombre: "Dogo Premium",
    colores: {
      "Blanco": ["S", "M", "L"],
      "Negro": ["M", "L", "XL"],
      "Gris": ["S", "M"],
      "Verde": ["L", "XL"]
    }
  }
};

function updateColors() {
  const tipo = document.getElementById("tipo").value;
  const colorSelect = document.getElementById("color");
  colorSelect.innerHTML = "";

  Object.keys(data[tipo].colores).forEach(color => {
    let opt = document.createElement("option");
    opt.value = color;
    opt.textContent = color;
    colorSelect.appendChild(opt);
  });

  updateSizes();
}

function updateSizes() {
  const tipo = document.getElementById("tipo").value;
  const color = document.getElementById("color").value;
  const tallaSelect = document.getElementById("talla");
  tallaSelect.innerHTML = "";

  data[tipo].colores[color].forEach(talla => {
    let opt = document.createElement("option");
    opt.value = talla;
    opt.textContent = talla;
    tallaSelect.appendChild(opt);
  });
}

function submitForm() {
  const tipo = document.getElementById("tipo").value;
  const color = document.getElementById("color").value;
  const talla = document.getElementById("talla").value;
  const cantidad = document.getElementById("cantidad").value;

  const resumen = `Pedido:\nTipo: ${tipo}\nColor: ${color}\nTalla: ${talla}\nCantidad: ${cantidad}`;
  alert(resumen);
}

window.onload = updateColors;
</script>

</head>

<body>

<header>
<h1>🎨 Tú diseñas</h1>
<p>Nos envías tu diseño y nosotros lo convertimos en prenda</p>
<a href="index.html">⬅ Volver</a>
</header>

<section>

<h2>Tu diseño en ropa</h2>
<p>Adjunta tus bocetos, imágenes o fanarts.</p>

<!-- FORMULARIO GOOGLE -->
<div class="formulario">
<iframe 
src="https://docs.google.com/forms/d/e/TU_FORM_ID/viewform?embedded=true">
Cargando…
</iframe>
</div>

<!-- NUEVO FORMULARIO DE PEDIDO -->
<div class="pedido">
<h2>🛒 Pedido de camisetas</h2>

<label>Tipo:</label>
<select id="tipo" onchange="updateColors()">
  <option value="bebe">Bebé</option>
  <option value="nino">Niño</option>
  <option value="adulto">Adulto</option>
</select>

<label>Color:</label>
<select id="color" onchange="updateSizes()"></select>

<label>Talla:</label>
<select id="talla"></select>

<label>Cantidad:</label>
<input type="number" id="cantidad" min="1" value="1">

<button onclick="submitForm()">Enviar pedido</button>
</div>

</section>

</body>
</html>
