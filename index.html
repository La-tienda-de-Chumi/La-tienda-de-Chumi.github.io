<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>La tienda de Chumi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

/* ===== RESET Y FONDO ===== */

body{
margin:0;
font-family:'Poppins',sans-serif;
color:#fff;
background:linear-gradient(180deg,#020c1b,#03162f,#052042);
}

body::before{
content:"";
position:fixed;
inset:0;
background-image:url("manga2-bg.png");
background-size:cover;
background-position:center;
opacity:0.35;
z-index:-2;
}

body::after{
content:"";
position:fixed;
inset:0;
background:radial-gradient(circle,rgba(0,0,0,0.2),rgba(0,0,0,0.7));
z-index:-1;
}

/* ===== HEADER ===== */

header{
padding:70px 20px 50px;
text-align:center;
background:linear-gradient(
135deg,
rgba(0,255,255,0.35),
rgba(0,140,255,0.35)
);
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,0.15);
}

header h1{
font-size:3rem;
margin:0;
}

header p{
font-size:1.2rem;
opacity:0.9;
}

/* ===== MENÚ VISUAL ===== */

.menu-visual{
display:flex;
flex-direction:column; /* vertical */
align-items:center; /* centrar tarjetas */
gap:40px;
padding:60px 8%;
}

/* ===== TARJETA BOTÓN ===== */

.menu-item{

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

width:260px;

padding:25px;
border-radius:20px;

cursor:pointer;

background:rgba(255,255,255,0.05);
backdrop-filter:blur(8px);

transition:transform .3s, box-shadow .3s;
text-decoration:none;

}

.menu-item:hover{
transform:translateY(-8px);
box-shadow:0 15px 40px rgba(0,255,255,0.35);
}

/* ===== CONTENEDOR IMAGEN ===== */

.image-container{

display:flex;
align-items:center;
justify-content:center;

position:relative;

width:170px;
height:170px;

}

/* ===== IMÁGENES ===== */

.image-container img{

position:absolute;

max-width:150px;
max-height:150px;

object-fit:contain;

transition:opacity .4s;

}

.image-container img.hover{
opacity:0;
}

.menu-item:hover .hover{
opacity:1;
}

.menu-item:hover .base{
opacity:0;
}

/* ===== TEXTO BOTONES ===== */

.menu-item span{

margin-top:15px;

background:rgba(0,0,0,0.55);

padding:8px 16px;

border-radius:20px;

font-weight:bold;

font-size:1rem;

color:white;

/* estilo comic */

font-family:
"Comic Sans MS",
"Comic Sans",
cursive;

}

/* ===== FOOTER ===== */

footer{
background:#000;
text-align:center;
padding:15px;
font-size:.85rem;
opacity:.7;
}

</style>
</head>

<body>

<header>
<h1>La tienda de Chumi</h1>
<p>Textil friki y crochet artesanal ✨ Bajo demanda</p>
</header>

<div class="menu-visual">

<a class="menu-item" href="textil.html">

<div class="image-container">
<img src="camiseta lisa.png" class="base">
<img src="camiseta friki.png" class="hover">
</div>

<span>Textil Friki</span>

</a>


<a class="menu-item" href="crochet.html">

<div class="image-container">
<img src="OVILLO.png" class="base">
<img src="AMIGURUMI.png" class="hover">
</div>

<span>Crochet Artesanal</span>

</a>


<a class="menu-item" href="medida.html">

<div class="image-container">
<img src="bocadillo.png" class="base">
<img src="camiseta idea.png" class="hover">
</div>

<span>Textil a tu medida</span>

</a>


<a class="menu-item" href="diseno.html">

<div class="image-container">
<img src="lienzo.png" class="base">
<img src="camiseta lienzo.png" class="hover">
</div>

<span>Tú diseñas, nosotros lo hacemos</span>

</a>

</div>

<footer>
© 2026 · La tienda de Chumi · Hecho con amor friki 💙
</footer>

</body>
</html>
